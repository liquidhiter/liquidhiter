<title id="title">Maxin — embedded and systems engineering</title>
<desc id="desc">Experience: C, C++, Python; Cortex-M, Bluetooth LE, radio drivers; FreeRTOS, Zephyr; concurrency, shared memory, event-driven design; build systems, CI, test automation. Building lightweight publish/subscribe middleware for FreeRTOS. Exploring OS internals, embedded Linux, edge AI, inference runtimes, and Rust.</desc>
